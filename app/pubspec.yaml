    - assets/lessons/Suomi/Beginner/placement.json
    - design-showcase/assets/echo-mark.svg
    - design-showcase/assets/echo-mark-flat.svg
  fonts:
    - family: DM Sans
      fonts:
        - asset: assets/fonts/DMSans-Variable.ttf
    - family: Newsreader
      fonts:
        - asset: assets/fonts/Newsreader-Variable.ttf
